[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["nekitdev <nekit@nekit.dev>"]
rust-version = "1.99"
edition = "2024"
repository = "https://github.com/qstd-rs/qstd"
license = "MIT"

[workspace.dependencies.trait-aliases]
version = "0.4.0"
default-features = false

[workspace.dependencies.qstd-brand]
version = "0.1.0"
default-features = false
path = "crates/qstd-brand"

[workspace.dependencies.qstd-core]
version = "0.1.0"
default-features = false
path = "crates/qstd-core"

[workspace.dependencies.qstd-num]
version = "0.1.0"
default-features = false
path = "crates/qstd-num"

[workspace.dependencies.qstd-state]
version = "0.1.0"
default-features = false
path = "crates/qstd-state"

[package]
name = "qstd"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Compile-time-checked quantum programming in Rust."
readme = "README.md"
documentation = "https://docs.rs/qstd"
repository.workspace = true
license.workspace = true
categories = ["science::quantum-computing"]
keywords = ["quantum", "quantum-computing", "qubit", "type-safe", "simulator"]

[dependencies.qstd-core]
workspace = true
